# 증권 가상 시장 시계. 시뮬레이터 규칙이다.
# 장 열림 · 닫힘 시각은 여기에 두지 않는다 — Securities::Phase::SCHEDULE 의 처음 · 끝이 정의 한 곳이다.
# speed: 장 시간 1분이 현실 몇 분인지가 아니라, 현실 1초 동안 가상 시계가 몇 초 가는지(배속).
# night_minutes: 그날 장 마감(15:30)부터 다음 영업일 장 시작(08:30)까지를 현실 몇 분에 흘리는지.
speed: 12
night_minutes: 5
# 단일가 매매(시가). 시뮬레이터 규칙이다. Securities::AuctionRun 이 읽는다.
# single_price: 시가를 단일가(동시호가)로 정할지. false 면 끄기 스위치로 장전 접수분을 접수 순서대로 접속매매 체결한다.
single_price: true
