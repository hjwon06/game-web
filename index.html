<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1공장 — 공장 관제 화면</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="game" class="game" aria-label="공장 화면"></main>
  <div id="labels" class="labels" aria-hidden="true"></div>

  <header id="hud" class="hud">
    <div>
      <p id="hud-count" class="hud-count" aria-live="polite">불러오는 중</p>
      <p class="hud-name">1공장<span id="hud-link" class="hud-link" hidden>연결 끊김 · 마지막 값</span></p>
    </div>
    <p id="hud-user" class="hud-user" hidden>
      <span id="hud-user-name"></span>
      <a href="/logout">로그아웃</a>
    </p>
  </header>

  <button id="alert-chip" class="alert-chip" type="button" hidden><i class="dot" aria-hidden="true"></i><span></span></button>

  <p id="inspect-hint" class="inspect-hint" hidden></p>
  <aside id="inspect" class="inspect" aria-live="polite" hidden></aside>
  <div id="bubble" class="bubble" hidden></div>

  <script src="vendor/phaser-3.90.0.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
