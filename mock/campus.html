function beltAt(u){let L=0;const s=[];for(let i=0;i<3;i++){const a=loop[i],b=loop[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);s.push([a,b,l]);L+=l;}let d=u*L;for(const [a,b,l] of s){if(d<=l)return[a[0]+(b[0]-a[0])*d/l,a[1]+(b[1]-a[1])*d/l];d-=l;}return loop[3];}

let selM=null,selB=null,last=performance.now(),prodT=0,zoomedIn=false;
function update(dt,t){
  workers.forEach((w,i)=>{if(w.job){const m=w.job.m;w.tx=m.x;w.ty=m.row===0?m.y+1.05:m.y-1.05;}
    const dx=w.tx-w.x,dy=w.ty-w.y,d=Math.hypot(dx,dy);w.moving=d>.05;
    if(w.moving){const s=Math.min(d,dt*1.6);w.x+=dx/d*s;w.y+=dy/d*s;}
    else if(w.job){if(w.job.phase==='walk'){w.job.phase='fix';w.job.until=t+1600;}else if(t>w.job.until){const m=w.job.m;w.job=null;apply(m,'repair');}}
    else if(Math.random()<dt*.35){w.tx=2.5+Math.random()*14;w.ty=i===2?9.9+Math.random()*.9:4.6+Math.random()*1.5;}});
  fork.u=(fork.u+dt/26)%1;
  M.forEach(m=>{if(m.st==='running'&&m.wo[2]<m.wo[3])m.wo[2]+=dt*2.2;});
  if(zoomedIn&&(prodT+=dt)>2.4){prodT=0;const r=M.filter(m=>m.st==='running');const m=r[Math.floor(Math.random()*r.length)];if(m)bubble(m,`+${3+Math.floor(Math.random()*9)} ${m.wo[1]}`,'#2F6B4F');}
  if(camT){const k=Math.min(1,dt*4);Z+=(camT.z-Z)*k;
    // 목표 지점이 화면의 목표 위치로 오도록 off 보간
    const sx=off.x+(camT.wx-camT.wy)*TW/2*Z, sy=off.y+(camT.wx+camT.wy)*TH/2*Z;off.x+=(camT.sx-sx)*k;off.y+=(camT.sy-sy)*k;
    if(Math.abs(camT.z-Z)<.002)camT=null;}
}
function apply(m,k){const b=m.v;m.v++;m.st={repair:'stopped',start:'running',stop:'stopped'}[k];bubble(m,`${KN[k]} 반영 · v${b}→v${m.v} · 200`,STC[m.st]);renderPop();}
function command(m,k){const ok={repair:'broken',start:'stopped',stop:'running'}[k];if(m.st!==ok)return;
  if(k==='repair'){const w=workers.filter(w=>!w.job).sort((a,b)=>Math.hypot(a.x-m.x,a.y-m.y)-Math.hypot(b.x-m.x,b.y-m.y))[0];if(w){w.job={m,phase:'walk'};bubble(m,'수리 요청 접수 · 작업자 이동 중','#1E3A5F');renderPop();return;}}
  apply(m,k);}
function draw(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;update(dt,t);

  const ents=B.map(b=>({d:b.x+b.w/2+b.y+b.d/2,f:()=>building(b,t)}));
  ents.push({d:HALL.x+HALL.y+10,f:()=>inHall(()=>drawHall(t))});
  ents.push({d:38+25.5,f:()=>trucksAtDock(t)});

  B.forEach(b=>sign(b,t));hallSign();
  if(Z<.75)onFloor(2.2,32.6,()=>{g.fillStyle='rgba(26,26,46,.4)';g.font='600 13px Pretendard';g.fillText('건물을 눌러 보기 · 생산동은 눌러서 들어가기 · 끌어서 이동',0,0);g.fillStyle='rgba(26,26,46,.3)';g.font='500 11px Pretendard';g.fillText('목업 · 수치는 2026-10-08 DB 스냅샷, 수주 고객은 시드',0,18);});
  placePop();requestAnimationFrame(draw);
}

function inside(px,py,poly4){let c=false;for(let i=0,j=3;i<4;j=i++){const a=poly4[i],b=poly4[j];if(((a[1]>py)!==(b[1]>py))&&(px<(b[0]-a[0])*(py-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}

    const hp=[P(HALL.x,HALL.y),P(HALL.x+HW,HALL.y),P(HALL.x+HW,HALL.y+HH),P(HALL.x,HALL.y+HH)];if(!inside(x,y,hp)){zoomOut();return;}selM=null;renderPop();return;}

  if(inside(x,y,hp)){zoomIn();return;}

  if(selB){const b=B.find(x=>x.id===selB);let rows='',note='';

    if(b.id==='qc'){const r=QC.defect*100/(QC.good+QC.defect);rows=`<div class="row"><span>양품</span><b>${QC.good.toLocaleString()}</b></div><div class="row"><span>불량</span><b>${QC.defect.toLocaleString()}</b></div><div class="row"><span>불량률</span><b>${r.toFixed(2)}%</b></div>`;note='production_events 양품·불량 합계';}
    if(b.id==='ship'){rows=`<div class="row"><span>완료 작업지시</span><b>${WO.done}</b></div><div class="row"><span>최근 완료</span><b>WO-3055 플랜지</b></div><div class="row"><span>대기 트럭</span><b>${Math.min(3,Math.ceil(WO.done/12))}대</b></div>`;note='shipments 테이블 추가 예정 · 지금은 완료 지시 기준';}
    el.innerHTML=`<div class="hd"><span class="c">${b.name}</span><span class="tag">실데이터</span></div>${rows}<div class="note">${note}</div>`;el.classList.remove('hide');return;}
  el.classList.add('hide');}
function placePop(){const el=document.getElementById('pop');let p=null;
  if(selM){const m=M.find(x=>x.id===selM);inHall(()=>{});p=m._top?[m._top[0]+34*Z,m._top[1]-34*Z]:null;}
  if(selB){const b=B.find(x=>x.id===selB);p=b._sign?[b._sign[0]+30,b._sign[1]-20]:null;}
  if(p){el.style.left=Math.min(innerWidth-264,p[0])+'px';el.style.top=Math.max(10,Math.min(innerHeight-200,p[1]))+'px';}}
setTimeout(()=>{if(zoomedIn)bubble(M[6],'정지 거절 · 409 버전 충돌 (이미 v13)','#C0392B',true);},1500);
requestAnimationFrame(draw);
